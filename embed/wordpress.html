<div class="smart-market">
  <iframe id="smart-market-frame"
          src="https://swork-gif.github.io/Market-Analysis/"
          title="შრომის ბაზრის ანალიზი"
          loading="lazy"
          style="width:100%;height:1800px;border:0;display:block"></iframe>
</div>
<script>
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://swork-gif.github.io') return;
    if (e.data && e.data.smartMarketHeight) {
      document.getElementById('smart-market-frame').style.height = e.data.smartMarketHeight + 'px';
    }
  });
</script>
